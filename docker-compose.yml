services:
  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
      - "8233:8233"

  flip-server:
    build: .
    command: uvicorn exercise.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  worker:
    build: .
    command: python -m exercise.worker
    environment:
      TEMPORAL_HOST: "temporal:7233"
      FLIP_SERVER_URL: "http://flip-server:8000/flip"
    depends_on:
      - temporal
      - flip-server

  api:
    build: .
    command: uvicorn exercise.api:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_HOST: "temporal:7233"
    depends_on:
      - temporal
